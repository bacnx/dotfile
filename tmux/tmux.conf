# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# History
set -g history-limit 10000

# Misc
set -g escape-time 0
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off

# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Base index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mode-keys vi

# Vim-tmux-navigator
# Inlined rather than using the plugin: nvim's side (nvim/lua/plugins/tmux-nav.lua)
# shells out to `tmux select-pane`, so it interoperates with these bindings directly.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h     if-shell "$is_vim" "send-keys C-h"     "select-pane -L"
bind-key -n C-j     if-shell "$is_vim" "send-keys C-j"     "select-pane -D"
bind-key -n C-k     if-shell "$is_vim" "send-keys C-k"     "select-pane -U"
bind-key -n C-l     if-shell "$is_vim" "send-keys C-l"     "select-pane -R"
bind-key -n C-Left  if-shell "$is_vim" "send-keys C-Left"  "select-pane -L"
bind-key -n C-Down  if-shell "$is_vim" "send-keys C-Down"  "select-pane -D"
bind-key -n C-Up    if-shell "$is_vim" "send-keys C-Up"    "select-pane -U"
bind-key -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Pane resizing
bind-key C-h     resize-pane -L 5
bind-key C-j     resize-pane -D 5
bind-key C-k     resize-pane -U 5
bind-key C-l     resize-pane -R 5
bind-key C-Left  resize-pane -L 5
bind-key C-Down  resize-pane -D 5
bind-key C-Up    resize-pane -U 5
bind-key C-Right resize-pane -R 5

# New/split window inheriting the current working directory
bind 's' split-window -v -c '#{pane_current_path}'
bind 'v' split-window -h -c '#{pane_current_path}'
bind 'c' new-window -c '#{pane_current_path}'

# Auto-name session after the basename of the active pane's directory
set-hook -g after-new-session   'rename-session "#{b:pane_current_path}"'
set-hook -g after-new-window     'rename-session "#{b:pane_current_path}"'
set-hook -g after-split-window   'rename-session "#{b:pane_current_path}"'

# Copy to system clipboard
# WSL2: wl-copy/xclip/xsel are not installed; win32yank is the only working path
# and matches nvim's clipboard provider (nvim/lua/config/options.lua).
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Catppuccin Mocha status bar
set -g status-position top
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[#{?client_prefix,fg=#f9e2af,fg=#cba6f7},bold]#S "
set -g status-right "#[fg=#6c7086]#{pane_current_path}"
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-format "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Plugins (TPM) — session persistence only; theme and vim-nav are hand-rolled above.
# Path set explicitly because this is an XDG layout, not the default ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 min; restore manually with prefix + C-r. Auto-restore is left off
# because the after-new-session hook above would rename restored sessions on the way in.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# resurrect's default save key is prefix + C-s, which would clobber `bind C-s send-prefix`
# above (the prefix is itself C-s). Move save to prefix + S so send-prefix survives.
set -g @resurrect-save 'S'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
