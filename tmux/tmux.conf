# Terminal
set -g default-terminal "tmux-256color"
# Assigned, not appended: `prefix + r` re-runs this file and an append (-ag)
# stacks a duplicate entry on every reload. Matched on "*" rather than a TERM
# name so a terminal that does not spell "256col" still gets truecolor. Smulx and
# Setulc carry nvim's undercurl and its colour out to the host terminal, which
# xterm-256color's own terminfo does not advertise. Single-quoted so tmux leaves
# the backslashes alone.
set -g terminal-overrides '*:RGB,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}/%d::%p2%{256}/%{256}%m%d::%p3%{256}%m%dm'

# History
set -g history-limit 10000

# Misc
set -g escape-time 0
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off

# Prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Base index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mode-keys vi

# Vim-tmux-navigator
# Inlined rather than using the plugin: nvim's side (nvim/lua/plugins/tmux-nav.lua)
# shells out to `tmux select-pane`, so it interoperates with these bindings directly.
# Backslashes are doubled because tmux processes escapes inside double quotes:
# a single \S would reach grep as a literal "S". Harmless today (ps -o comm=
# prints a bare command name, so the path group never has to match) but wrong.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h     if-shell "$is_vim" "send-keys C-h"     "select-pane -L"
bind-key -n C-j     if-shell "$is_vim" "send-keys C-j"     "select-pane -D"
bind-key -n C-k     if-shell "$is_vim" "send-keys C-k"     "select-pane -U"
bind-key -n C-l     if-shell "$is_vim" "send-keys C-l"     "select-pane -R"
bind-key -n C-Left  if-shell "$is_vim" "send-keys C-Left"  "select-pane -L"
bind-key -n C-Down  if-shell "$is_vim" "send-keys C-Down"  "select-pane -D"
bind-key -n C-Up    if-shell "$is_vim" "send-keys C-Up"    "select-pane -U"
bind-key -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Pane resizing
bind-key C-h     resize-pane -L 5
bind-key C-j     resize-pane -D 5
bind-key C-k     resize-pane -U 5
bind-key C-l     resize-pane -R 5
bind-key C-Left  resize-pane -L 5
bind-key C-Down  resize-pane -D 5
bind-key C-Up    resize-pane -U 5
bind-key C-Right resize-pane -R 5

# New/split window inheriting the current working directory
bind 's' split-window -v -c '#{pane_current_path}'
bind 'v' split-window -h -c '#{pane_current_path}'
bind 'c' new-window -c '#{pane_current_path}'

# Auto-name after the basename of the active pane's directory.
#
# The session hook only fires on a session tmux named itself (its default names
# are plain integers), so an explicit `tmux new -s <name>` keeps the name you
# asked for. rename-session is also allowed to fail quietly: session names are
# unique per server, and two sessions opened in the same directory would
# otherwise print "duplicate session" and leave the second one half-renamed.
set-hook -g after-new-session 'run -b "case \"#{session_name}\" in \"\"|*[!0-9]*) exit 0;; esac; tmux rename-session -t \"=#{session_name}\" -- \"#{b:pane_current_path}\" 2>/dev/null"'

# Window-scoped events rename the window; renaming the whole session from here
# would let a window opened in another repo rename the session out from under it.
set-hook -g after-new-window     'rename-window "#{b:pane_current_path}"'
set-hook -g after-split-window   'rename-window "#{b:pane_current_path}"'

# Copy to system clipboard via bin/clip from this repo, the same entry point
# .zshrc and nvim use, so the backend is chosen in exactly one place.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip -i'
# The default mouse and Enter bindings pipe to nothing, so they land in the tmux
# paste buffer only -- and set-clipboard is "external", so tmux will not emit
# OSC 52 for them either. Without these two lines a mouse drag never reaches the
# system clipboard, while `y` does.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'clip -i'
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'clip -i'

# Reload config
# #{config_files} is whatever tmux actually loaded, so this cannot drift.
bind r source-file "#{config_files}" \; display "Reloaded"

# Catppuccin Mocha status bar
# Default is 15s, which leaves #{pane_current_path} visibly stale after a cd.
set -g status-interval 5
set -g status-position top
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[#{?client_prefix,fg=#f9e2af,fg=#cba6f7},bold]#S "
set -g status-right "#[fg=#6c7086]#{s|^$HOME|~|:pane_current_path}"
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-format "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Plugins (TPM) — session persistence only; theme and vim-nav are hand-rolled above.
# Path set explicitly because this is an XDG layout, not the default ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 min. Auto-restore is safe now that the after-new-session
# hook above leaves non-numeric (i.e. resurrect-restored) session names alone.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Without this resurrect saves the layout but not the scrollback, so restored
# panes come back blank.
set -g @resurrect-capture-pane-contents 'on'

# resurrect's default save key is prefix + C-s, which would clobber `bind C-s send-prefix`
# above (the prefix is itself C-s). Move save to prefix + S so send-prefix survives.
set -g @resurrect-save 'S'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
