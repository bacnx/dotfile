# Symlinked to ~/.config/starship.toml. The palette below is duplicated as hex
# literals in FZF_DEFAULT_OPTS in .zshrc — fzf takes an env var, starship takes
# TOML, so a theme change has to touch both.
palette = "catppuccin_mocha"
format = "$directory$git_branch$git_status$nix_shell$cmd_duration$character"

[directory]
style = "bold lavender"
truncation_length = 1

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
style = "bold red"

[nix_shell]
symbol = " "
style = "bold blue"
format = "[$symbol$state]($style) "

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
